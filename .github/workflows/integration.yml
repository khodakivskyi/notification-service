name: Integration

on:
  pull_request:
    branches: [ master, publish ]
  push:
    branches: [ master ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      main: ${{ steps.filter.outputs.main }}
      cli: ${{ steps.filter.outputs.cli }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            main:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'docker-compose.yml'

            cli:
              - 'cli/**'
  main:
    needs: detect-changes
    if: needs.detect-changes.outputs.main == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Create env variables
      run: |
        # Create test .env file
        cat > .env << EOF
        NODE_ENV=test
        PORT=3001
        LOG_LEVEL=info
        DB_USER=postgres
        DB_PASSWORD=postgres
        DB_NAME=notifications
        DB_PORT=5432
        DATABASE_URL=postgresql://postgres:postgres@db:5432/notifications?sslmode=disable
        SMTP_HOST=smtp.example.com
        SMTP_PORT=587
        SMTP_USER=test@example.com
        SMTP_PASS=testpass
        RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
        EMAIL_QUEUE_NAME=email_notifications
        RABBITMQ_DLX_EXCHANGE=notification.dlx
        EMAIL_DLQ_NAME=email.dlq
        EMAIL_DLQ_ROUTING_KEY=email.dlq
        APP_PORT=3001
        EOF

    - name: Run unit tests
      run: npm test

    - name: Start services with docker compose
      run: |
        # Start only app service with dependencies (db, rabbitmq)
        docker compose --env-file .env up -d --build db rabbitmq
        
        # Wait for dependencies to be healthy
        echo "Waiting for PostgreSQL and RabbitMQ to be ready..."
        timeout 60 bash -c '
        until [ "$(docker inspect --format="{{.State.Health.Status}}" notification-db)" = "healthy" ] \
          && [ "$(docker inspect --format="{{.State.Health.Status}}" notification-rabbitmq)" = "healthy" ];
        do
          sleep 2
        done
        '
        
        # Start app service
        docker compose --env-file .env up -d app
        
        # Wait for app to start
        echo "Waiting for app to start..."
        sleep 15

    - name: Test health endpoint
      run: |
        # Test health endpoint with retries
        for i in {1..5}; do
          if curl -f http://localhost:3001/api/health; then
            echo "✅ Health check passed!"
            exit 0
          fi
          echo "Attempt $i failed, retrying in 3 seconds..."
          sleep 3
        done
        
        echo "❌ Health check failed after 5 attempts"
        docker compose --env-file .env logs app
        exit 1

    - name: Cleanup
      if: always()
      run: |
        docker compose --env-file .env down -v
        rm -f .env
        echo "✅ Cleanup completed"
  cli-tool:
    needs: detect-changes
    if: needs.detect-changes.outputs.cli == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Run CLI tests
        run: npm test
